<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">WorkCore ERP Modules extraction architecture</title><desc id="desc">Architecture map of WorkCore ERP Modules: one shared foundation supports business network, commercial, work operations, property operations, and workforce assurance extensions, with deterministic build and validation tooling producing manifests and checksums.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0c2833"/><stop offset="1" stop-color="#135f59"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6z" fill="#99f6e4"/></marker></defs><rect width="1200" height="480" rx="24" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="52" y="52" fill="#99f6e4" font-size="13" font-weight="700" letter-spacing="3">MERGED EXTRACTION BASELINE � PACKAGE OWNERSHIP VISIBLE</text><text x="52" y="91" fill="#f8fafc" font-size="26" font-weight="800">One mandatory foundation, five domain extensions</text><g stroke="#5eead4" stroke-width="2" fill="#114744"><rect x="45" y="166" width="220" height="102" rx="14"/><rect x="330" y="166" width="220" height="102" rx="14"/><rect x="615" y="166" width="220" height="102" rx="14"/><rect x="900" y="166" width="255" height="102" rx="14"/></g><g stroke="#99f6e4" stroke-width="3" marker-end="url(#a)"><path d="M265 217H323"/><path d="M550 217H608"/><path d="M835 217H893"/></g><g fill="#f8fafc" text-anchor="middle"><text x="155" y="200" font-size="15" font-weight="700">Shared foundation</text><text x="155" y="225" font-size="12" fill="#a7f3d0">tenancy � permissions � actions</text><text x="440" y="200" font-size="15" font-weight="700">Business network</text><text x="440" y="225" font-size="12" fill="#a7f3d0">CRM � catalogue � support</text><text x="725" y="200" font-size="15" font-weight="700">Commercial</text><text x="725" y="225" font-size="12" fill="#a7f3d0">finance � payroll � inventory</text><text x="1027" y="200" font-size="15" font-weight="700">Operations + workforce</text><text x="1027" y="225" font-size="12" fill="#a7f3d0">dispatch � property � assurance</text></g><rect x="190" y="335" width="820" height="72" rx="13" fill="#173b48" stroke="#60a5fa"/><text x="600" y="363" fill="#dbeafe" text-anchor="middle" font-size="14" font-weight="700">tools/build_extensions.py  manifests + checksums</text><text x="600" y="388" fill="#bfdbfe" text-anchor="middle" font-size="12">tests/test_build_extensions.py � tools/validate_repository.py � host-overlay</text></g></svg>

